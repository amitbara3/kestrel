# Kestrel load balancer.
#
# The replicas are stateless, so this is deliberately a plain least-connections
# balancer with no session affinity: any replica can serve any request, and
# ip_hash would only concentrate a hot client onto one of them.

worker_processes auto;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # `rt` is the balancer's own view of latency and `uct/uht/urt` the upstream's;
    # comparing them is how you tell a slow app from a slow network.
    log_format kestrel '$remote_addr - [$time_local] "$request" $status '
                       '$body_bytes_sent rt=$request_time '
                       'upstream=$upstream_addr urt=$upstream_response_time '
                       'cache=$upstream_http_x_cache rid=$upstream_http_x_request_id';

    access_log /var/log/nginx/access.log kestrel;
    error_log  /var/log/nginx/error.log warn;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    server_tokens off;

    keepalive_timeout  65;
    client_max_body_size 128k;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 512;

    upstream kestrel_app {
        # least_conn, not round-robin: a redirect that misses cache takes ~50x
        # longer than one that hits, so queue depth is a better load signal than
        # request count.
        least_conn;

        server app1:3000 max_fails=3 fail_timeout=10s;
        server app2:3000 max_fails=3 fail_timeout=10s;
        server app3:3000 max_fails=3 fail_timeout=10s;

        # Reuse upstream connections; without this every proxied request pays a
        # fresh TCP handshake, which dominates the latency of a cache hit.
        keepalive 64;
    }

    server {
        listen 80 default_server;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        # The app only trusts this header from a peer inside TRUSTED_PROXIES,
        # which is why rate-limit identity cannot be spoofed from outside.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 2s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;

        # Retry the next replica when one is down or resets, but never replay a
        # non-idempotent request that the upstream already began processing.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;

        # Redirects must not be cached by the balancer either — the link behind
        # a code can be deleted at any time.
        proxy_buffering off;

        location / {
            proxy_pass http://kestrel_app;
        }

        # The balancer's own liveness, answered without touching an upstream.
        location = /lb-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
